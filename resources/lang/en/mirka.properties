# Log translations for the Mirka belt configurator (v1.5.25).
# Plenty only shows log entries below level "error" if the log code has a
# translation. These keys make the info/routine/measurement lines visible
# in the back end log. The actual plain text is carried in the additional
# info ("text").
diag = "Mirka diagnostics (see additional info)"
warenkorb = "Mirka: basket configuration processed (see additional info)"
persistOk = "Mirka: basket persistence successful (see additional info)"
messung = "Mirka: measurement / structure (see additional info)"
auftragOk = "Mirka: order complete - all 6 values applied (see additional info)"
build = "Mirka: build/version marker (version in additional info) - NOT an error"
stufeA = "Mirka: stage-A measurement basket->order (see additional info) - NOT an error"
